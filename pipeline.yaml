# Strix Halo Pipeline v2.0 Configuration
# Save as pipeline.yaml and run: python3 strix_halo_pipeline_v2.py --config pipeline.yaml

npu:
  draft_model: "qwen3:1.7b"
  draft_pmode: "performance"
  draft_port: 52625
  draft_max_concurrent: 2        # Max simultaneous NPU requests
  draft_tokens: 128              # Default draft length
  draft_tokens_max: 256          # Upper bound for adaptive scaling
  draft_tokens_min: 32           # Lower bound for adaptive scaling

gpu:
  gpu_model: "./models/Qwen3-8B-Q4_K_M.gguf"
  gpu_backend: "rocm"            # "rocm" or "vulkan"
  gpu_port: 9999
  gpu_ctx: 4096
  gpu_layers: 99
  gpu_threads: 8
  gpu_max_concurrent: 4          # Max simultaneous GPU decode streams
  gpu_batch_size: 4              # Batch size for prefill

api:
  port: 11435
  host: "0.0.0.0"
  temperature: 0.6
  top_p: 0.95
  mode: "pipeline"
  verbose: false
  metrics_enabled: true
  metrics_port: 11436

routing:
  auto_short_token_threshold: 50   # Prompts under this go to NPU
  auto_short_max_tokens: 128       # Short responses go to NPU

circuit_breaker:
  cb_failure_threshold: 3        # Failures before tripping
  cb_recovery_timeout: 30.0      # Seconds before half-open test

kv_cache:
  kv_cache_ttl: 300.0              # Seconds to keep KV cache warm
  kv_cache_max_entries: 100        # Max cached conversations
